name: trivy
on: 
  push:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: trivy vamos
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: '.'
          format: table
          exit-code: '0'
          