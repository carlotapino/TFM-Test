name: Primera pipeline

on:
  push:
    branches: [main]

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Terraform format
        run: terraform fmt -check
      - name: Terraform validate
        run: terraform validate
      - name: Hola món
        run: echo "La pipeline funciona!"
      - name: Llista fitxers
        run: ls -la
