name: Escaneig checkov i trivy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  
permissions:
  contents: read
  pull-requests: write  

jobs:
  p1-checkov-secret-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: checkov vamos
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: secrets

  p1-trivy-secret-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: trivy vamos
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: terraform
          scanners: secret
          format: table
          exit-code: 1

  p2-validate:
    needs: [p1-checkov-secret-detection, p1-trivy-secret-detection]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format validation
        run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform


  p3-checkov-static-scanning:
    needs: [p2-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkov report
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true
          output_format: sarif
          output_file_path: checkov.sarif

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-checkov
          path: checkov.sarif
      - name: checkov vamos
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform

  p3-trivy-static-scanning:
    needs: [p2-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivy report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: json
          output: trivy.json
          exit-code: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-trivy
          path: trivy.json

      - name: Trivy fail (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1


  opa:
    needs: p3-trivy-static-scanning
    runs-on: ubuntu-latest
    container: openpolicyagent/conftest:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Conftest vamos
        run: conftest test -o github -p policy terraform 

  report:
    needs: [p2-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instalar Checkov
        run: pip install checkov

      - name: Run Checkov (JSON, never blocks)
        run: checkov -d terraform --framework terraform --output json --soft-fail > checkov-full.json

      - name: Run Trivy (JSON, never blocks)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: json
          output: trivy.json
          exit-code: 0

      - name: Run Conftest (JSON, never blocks)
        run: |
          docker run --rm -v "$PWD":/project -w /project openpolicyagent/conftest \
            test -p policy terraform --output json > conftest.json || true

      - name: Generate review report
        run: |
          {
            echo "Security report"
            
            echo "## 1. Findings (failed checks)"
            echo ""
            echo "### Checkov"
            echo ""
            echo "Passed: $(jq '.summary.passed' checkov-full.json) | Failed: $(jq '.summary.failed' checkov-full.json) | Skipped: $(jq '.summary.skipped' checkov-full.json)"
            echo ""
            echo "| Check | Description | Resource | Location |"
            echo "|---|---|---|---|"
            jq -r '.results.failed_checks[]? | "| \(.check_id) | \(.check_name) | \(.resource) | \(.file_path):\(.file_line_range[0]) |"' checkov-full.json
            echo ""

            echo "### Trivy"
            echo ""
            echo "| ID | Severity | Description | Location |"
            echo "|---|---|---|---|"
            jq -r '.Results[]? | .Target as $t | .Misconfigurations[]? | "| \(.ID) | \(.Severity) | \(.Title) | \($t):\(.CauseMetadata.StartLine // "?") |"' trivy.json
            echo ""

            echo "Policies"
            echo ""
            echo "| Type | Message |"
            echo "|---|---|"
            jq -r '.[]? | (.failures[]? | "| FAIL | \(.msg) |"), (.warnings[]? | "| WARN | \(.msg) |")' conftest.json
            echo ""

            echo "## 2. Suppressions "
            echo ""
            echo "Verify that each justification is valid before approving."
            echo ""
            echo "### Checkov"
            echo ""
            echo "| Check | Resource | File | Justification |"
            echo "|---|---|---|---|"
            jq -r '.results.skipped_checks[]? | "| \(.check_id) | \(.resource) | \(.file_path) | \(.check_result.suppress_comment // "NO JUSTIFICATION") |"' checkov-full.json
            echo ""
            echo "### All suppressions in the code (Checkov and Trivy)"
            echo ""
            echo '```'
            grep -rn -B1 -E "#(checkov:skip|trivy:ignore)" terraform/ || echo "None"
            echo '```'
          } | tee review-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-report
          path: |
            review-report.md
            checkov-full.json
            trivy.json
            conftest.json

        # https://safeguard.sh/resources/blog/github-secret-scanning-vs-dedicated-scanning-tools