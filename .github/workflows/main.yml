name: Escaneig checkov i trivy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: checkov vamos
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform, secrets
          output_format: cli

  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: trivy vamos
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          scanners: misconfig,secret
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

  