name: Escaneig checkov i trivy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  
permissions:
  contents: read
  pull-requests: write  

jobs:
  p1-checkov-secret-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: checkov vamos
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: secrets

  p1-trivy-secret-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: trivy vamos
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: terraform
          scanners: secret
          format: table
          exit-code: 1

  p2-validate:
    needs: [p1-checkov-secret-detection, p1-trivy-secret-detection]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format validation
        run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform


  p3-checkov-static-scanning:
    needs: [p2-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkov report
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true
          output_format: sarif
          output_file_path: checkov.sarif

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-checkov
          path: checkov.sarif
      - name: checkov vamos
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform

  p3-trivy-static-scanning:
    needs: [p2-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v44

      - name: Trivy report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: json
          output: trivy.json
          exit-code: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-trivy
          path: trivy.json

      - name: Trivy fail (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1


  opa:
    needs: p3-trivy-static-scanning
    runs-on: ubuntu-latest
    container: openpolicyagent/conftest:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Conftest vamos
        run: conftest test -o github -p policy terraform 


        # https://safeguard.sh/resources/blog/github-secret-scanning-vs-dedicated-scanning-tools