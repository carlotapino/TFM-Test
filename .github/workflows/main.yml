name: Escaneig checkov i trivy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  

jobs:
  p1-checkov-secret-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: checkov vamos
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: secrets

  p1-trivy-secret-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: trivy vamos
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: terraform
          scanners: secret
          format: table
          #everity: CRITICAL,HIGH
          exit-code: 1

  p2-validate:
    needs: [p1-checkov-secret-detection, p1-trivy-secret-detection]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format validation
        run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform


  p3-checkov-static-scanning:
    needs: [p2-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: checkov vamos
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform

  p3-trivy-static-scanning:
    needs: [p2-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: trivy vamos
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

  opa:
    needs: [p3-checkov-static-scanning, p3-trivy-static-scanning]
    runs-on: ubuntu-latest
    container: openpolicyagent/conftest:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Conftest vamos
        run: conftest test -o github -p policy terraform 


        # https://safeguard.sh/resources/blog/github-secret-scanning-vs-dedicated-scanning-tools