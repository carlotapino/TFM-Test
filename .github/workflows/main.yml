name: Primera pipeline

on:
  push:
    branches: [main]

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: ls -la

      - name: Show Terraform files
        run: find . -name "*.tf"

      - name: Run security scanner
        run: python scanner/scanner.py
        continue-on-error: true

      - name: Run secrets scanner
        run: python scanner/secrets.py
